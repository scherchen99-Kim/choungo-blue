<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHOUNGO BLUE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="CHOUNGO BLUE — 기획부터 디자인, 제작, 설치까지 한 곳에서. 광고디자인 · POP · 디스플레이 · 사인 전문 크리에이티브 프로덕션.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
/* Layout: full-bleed black/white bands; edge-to-edge image grids; type does the work, no cards */
:root {
  --black: #000055;
  --white: #ffffff;
  --paper: #f3f3f0;
  --grey: #8c8c88;
  --line: #dcdcd7;
  --line-dark: #2a2a2c;
  --blue: #007fff;          /* CHOUNGO Blue — 단 한 곳의 강조색 */
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --pad: clamp(16px, 4vw, 56px);
  --ease: cubic-bezier(.2, .7, .1, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: auto; -webkit-text-size-adjust: 100%; }
body { background: var(--white); color: var(--black); font-family: var(--body); font-size: 16px; line-height: 1.75; word-break: keep-all; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--black); }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
h1, h2, h3, h4 { margin: 0; font-weight: 800; }
p { margin: 0; }

.inner { padding-left: max(var(--pad), var(--gutter)); padding-right: max(var(--pad), var(--gutter-r)); }
.label { font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
.display { font-family: var(--display); font-stretch: 75%; font-weight: 850; text-transform: uppercase; letter-spacing: -.01em; line-height: .9; text-wrap: balance; }
.link-arrow { display: inline-flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; padding-bottom: 6px; border-bottom: 1px solid currentColor; transition: gap .3s var(--ease); }
.link-arrow:hover { gap: 20px; }
.link-arrow::after { content: "→"; letter-spacing: 0; }

/* ---------- Header ---------- */
.site-header { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 50; color: var(--white); transition: background .4s var(--ease), padding .4s var(--ease); }
.site-header .bar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 26px; transition: padding .4s var(--ease); }
.site-header.solid { background: var(--black); }
.site-header.solid .bar { padding-block: 16px; }
.logo { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; }
.logo-word { position: relative; font-family: var(--display); font-weight: 900; font-stretch: 100%; font-size: 26px; letter-spacing: .05em; line-height: 1; }
.logo-word b { color: #095fe0; font-weight: inherit; }
.logo-desc { font-family: var(--display); font-size: 9px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; line-height: 1; opacity: .7; padding-left: .3em; }   /* balances the trailing letter-spacing so it centres optically */
.nav { display: flex; gap: clamp(20px, 3vw, 44px); }
.nav a { position: relative; font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; padding-block: 6px; }
.nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #095fe0; transform: scaleX(0); transform-origin: left; transition: transform .35s var(--ease); }
.nav a:hover::after, .nav a.active::after { transform: scaleX(1); }
.menu-btn { display: none; font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .18em; }
@media (max-width: 860px) {
  .nav, .logo-desc { display: none; }
  .menu-btn { display: block; }
}
.mobile-menu { position: fixed; inset: 0; z-index: 70; background: var(--black); color: var(--white); display: flex; flex-direction: column; padding-top: calc(env(safe-area-inset-top, 0px) + 16px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); }
.mobile-menu.open { opacity: 1; pointer-events: auto; }
.mobile-menu .bar { display: flex; justify-content: space-between; align-items: center; padding-block: 10px; }
.mobile-menu nav { display: grid; gap: 6px; margin-top: auto; }
.mobile-menu nav a { font-family: var(--display); font-weight: 850; font-stretch: 75%; font-size: clamp(44px, 13vw, 72px); line-height: 1; text-transform: uppercase; }
.mobile-menu .meta { margin-top: 36px; color: var(--grey); font-size: 14px; }

/* ---------- View transition ---------- */
#view { min-height: 100vh; }
#view.leaving { opacity: 0; transition: opacity .22s ease; }
#view.entering { animation: viewIn .6s var(--ease); }
@keyframes viewIn { from { opacity: .001; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- Hero ---------- */
.hero { position: relative; height: 100vh; height: 100svh; min-height: 560px; background: var(--black); color: var(--white); overflow: hidden; }
.hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
.hero-slide.on { opacity: 1; }
.hero-slide img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); }
.hero-slide.on img { animation: kenburns 9s linear forwards; }
@keyframes kenburns { from { transform: scale(1.06); } to { transform: scale(1.0); } }
.hero::after { content: none; }
.hero-content { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding-bottom: clamp(32px, 6vh, 72px); display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 32px; }
.hero h1 { font-size: clamp(54px, 10.5vw, 188px); }
.hero .kicker { margin-bottom: clamp(16px, 2.4vh, 28px); display: flex; align-items: center; gap: 14px; }
.hero .kicker::before { content: ""; width: 34px; height: 2px; background: var(--white); }
.hero-side { display: grid; gap: 18px; justify-items: end; text-align: right; min-width: 0; }
.hero-caption { font-size: 13px; line-height: 1.5; opacity: .85; max-width: 260px; }
.hero-caption b { display: block; font-family: var(--display); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; opacity: .7; margin-bottom: 4px; }
.hero-dots { display: flex; gap: 8px; }
.hero-dots button { width: 36px; height: 20px; position: relative; }
.hero-dots button::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 2px; background: rgba(255,255,255,.35); }
.hero-dots button::after { content: ""; position: absolute; left: 0; top: 9px; height: 2px; width: 0; background: var(--white); }
.hero-dots button.on::after { animation: dot 6.5s linear forwards; }
@keyframes dot { to { width: 100%; } }
.sample-tag { position: absolute; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 96px); right: max(var(--pad), var(--gutter-r)); font-family: var(--display); font-size: 10px; letter-spacing: .2em; font-weight: 600; text-transform: uppercase; color: rgba(255,255,255,.75); border: 1px solid rgba(255,255,255,.4); padding: 4px 8px; }
@media (max-width: 700px) {
  .hero-content { grid-template-columns: 1fr; }
  .hero-side { justify-items: start; text-align: left; }
}

/* ---------- Sections ---------- */
.section { padding-block: clamp(80px, 12vw, 168px); }
.section.tight { padding-block: clamp(56px, 8vw, 104px); }
.dark { background: var(--black); color: var(--white); }
.paper { background: var(--paper); }

.intro { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(40px, 6vw, 120px); align-items: end; }
.intro h2 { font-size: clamp(40px, 6.2vw, 104px); }
.intro h2 em { font-style: normal; color: var(--blue); }
.intro .copy { display: grid; gap: 28px; max-width: 520px; font-size: 17px; color: #3b3b3d; }
@media (max-width: 900px) { .intro { grid-template-columns: 1fr; } }

.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: clamp(32px, 4vw, 56px); }
.sec-head h2 { font-size: clamp(36px, 5vw, 76px); }
.sec-head .label { color: var(--grey); display: block; margin-bottom: 18px; }

/* ---------- Work grid (edge to edge, no gaps) ---------- */
.work-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.work-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile { position: relative; display: block; overflow: hidden; background: #fff; aspect-ratio: 4 / 3; }
.tile img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.1s var(--ease), filter .6s var(--ease); }
.tile .ov { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: clamp(16px, 2vw, 28px); color: var(--white); background: rgba(9,95,224,.45); opacity: 0; transition: opacity .45s var(--ease); }
.tile .ov h3 { font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: clamp(18px, 1.7vw, 26px); line-height: 1.1; text-transform: uppercase; transform: translateY(10px); transition: transform .5s var(--ease); }
.tile .ov .label { font-size: 10.5px; opacity: .8; transform: translateY(10px); transition: transform .5s var(--ease) .03s; }
.tile .smp { position: absolute; top: 12px; left: 12px; font-family: var(--display); font-size: 9.5px; letter-spacing: .2em; font-weight: 700; color: var(--white); background: rgba(0,0,0,.45); padding: 3px 6px; backdrop-filter: blur(4px); }
.tile:hover img, .tile:focus-visible img { transform: scale(1.045); }
.tile:hover .ov, .tile:focus-visible .ov { opacity: 1; }
.tile:hover .ov h3, .tile:hover .ov .label, .tile:focus-visible .ov h3 { transform: none; }
@media (hover: none) { .tile .ov { opacity: 1; } .tile .ov h3, .tile .ov .label { transform: none; } }
@media (max-width: 1100px) { .work-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .work-grid.cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .work-grid, .work-grid.cols-3 { grid-template-columns: 1fr; } }
.tile.pan img { position: absolute; top: 0; left: 0; width: 100%; height: auto; object-fit: initial; will-change: transform; }
.tile.pan.live img { animation: tilePan 38s ease-in-out infinite alternate both; }
@keyframes tilePan { 0%, 7% { transform: translateY(0); } 93%, 100% { transform: translateY(var(--pan, 0px)); } }   /* holds the top (with its menu) ~2.7s before scrolling */
.tile.kb.live img { animation: tileKb 16s ease-in-out infinite alternate; will-change: transform; }
@keyframes tileKb { from { transform: scale(1); } to { transform: scale(1.12); } }
.tile.pan, .tile.kb { }
.tile.out { opacity: 0; transform: scale(.98); transition: opacity .25s ease, transform .25s ease; }
.tile.in { animation: tileIn .55s var(--ease) both; }
@keyframes tileIn { from { opacity: .001; transform: translateY(16px); } to { opacity: 1; transform: none; } }

/* ---------- Services (list, no cards) ---------- */
.services { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line-dark); }
.svc { padding: 34px 32px 40px 0; border-bottom: 1px solid var(--line-dark); display: grid; gap: 12px; align-content: start; }
.svc:not(:nth-child(3n+1)) { padding-left: 32px; border-left: 1px solid var(--line-dark); }
.svc h3 { font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: clamp(22px, 2vw, 30px); line-height: 1.05; text-transform: uppercase; }
.svc p { color: #a3a3a0; font-size: 15px; line-height: 1.7; }
.svc .label { color: var(--grey); font-size: 10.5px; }
@media (max-width: 900px) {
  .services { grid-template-columns: 1fr 1fr; }
  .svc, .svc:not(:nth-child(3n+1)) { padding: 28px 20px 32px 0; border-left: 0; }
  .svc:nth-child(2n) { padding-left: 20px; border-left: 1px solid var(--line-dark); }
}
@media (max-width: 560px) { .services { grid-template-columns: 1fr; } .svc, .svc:nth-child(2n) { padding: 24px 0; border-left: 0; } }

/* ---------- Process ---------- */
.process-title { font-size: clamp(44px, 8.4vw, 150px); }
.process-title span { display: block; color: var(--blue); }
.steps { list-style: none; margin: clamp(48px, 6vw, 88px) 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 2px solid var(--black); }
.steps li { padding: 22px 24px 0 0; display: grid; gap: 10px; align-content: start; position: relative; }
.steps .no { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .12em; color: var(--blue); font-variant-numeric: tabular-nums; }
.steps h3 { font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: clamp(20px, 1.9vw, 28px); line-height: 1.05; text-transform: uppercase; }
.steps p { font-size: 14.5px; color: #4a4a4d; line-height: 1.7; }
.steps li::before { content: ""; position: absolute; top: -7px; left: 0; width: 12px; height: 12px; background: var(--black); }
.steps li:last-child::before { background: var(--blue); }
@media (max-width: 900px) { .steps { grid-template-columns: 1fr; border-top: 0; border-left: 2px solid var(--black); gap: 32px; } .steps li { padding: 0 0 0 28px; } .steps li::before { top: 4px; left: -7px; } }

/* ---------- Facilities teaser split ---------- */
.split { display: grid; grid-template-columns: 1fr 1fr; min-height: min(90vh, 860px); }
.split .media { position: relative; overflow: hidden; background: #d4d4d0; }
.split .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.split .body { display: flex; flex-direction: column; justify-content: center; gap: 36px; padding-block: clamp(56px, 8vw, 120px); }
.split h2 { font-size: clamp(40px, 5.4vw, 92px); }
.eq-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line-dark); }
.eq-list li { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--line-dark); }
.eq-list li span:first-child { font-family: var(--display); font-weight: 700; font-stretch: 90%; text-transform: uppercase; font-size: clamp(16px, 1.4vw, 20px); letter-spacing: .02em; }
.eq-list li span:last-child { color: var(--grey); font-size: 14px; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; min-height: 0; } .split .media { aspect-ratio: 4 / 3; } }

/* ---------- Spotlight ---------- */
.spotlight { text-align: center; }
.spotlight h2 { font-size: clamp(36px, 5.6vw, 92px); }
.spotlight .scope { margin-top: 18px; color: var(--grey); }
.spotlight .lede { margin: 18px auto 0; max-width: 640px; color: #4a4a4d; }
.spotlight a.frame { display: block; margin: clamp(40px, 5vw, 72px) auto 0; max-width: 1480px; overflow: hidden; }
.spotlight a.frame img { width: 100%; aspect-ratio: 16 / 8; object-fit: cover; transition: transform 1.2s var(--ease); }
.spotlight a.frame:hover img { transform: scale(1.03); }

/* ---------- CTA ---------- */
.cta { text-align: center; }
.cta h2 { font-size: clamp(40px, 7vw, 124px); }
.cta p { margin: 24px auto 0; max-width: 560px; color: #a3a3a0; }
.btn-outline { display: inline-flex; align-items: center; justify-content: center; gap: 14px; margin-top: 44px; padding: 20px 38px; border: 1.5px solid currentColor; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .2em; text-transform: uppercase; transition: background .3s var(--ease), color .3s var(--ease); }
.btn-outline:hover { background: var(--white); color: var(--black); }
.btn-solid { display: inline-flex; align-items: center; justify-content: center; gap: 14px; padding: 18px 34px; background: var(--black); color: var(--white); font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; transition: background .3s var(--ease); }
.btn-solid:hover { background: var(--blue); }

/* ---------- Partners ---------- */
.partners { background: var(--white); color: var(--black); padding-block: clamp(56px, 7vw, 96px); overflow: hidden; border-top: 1px solid var(--line); }
.partners .label { color: var(--blue); }
.partners h2 { font-family: var(--display); font-weight: 850; font-stretch: 75%; text-transform: uppercase; font-size: clamp(32px, 4vw, 60px); line-height: 1; margin-top: 12px; }
.p-track { display: flex; gap: clamp(40px, 6vw, 88px); width: max-content; margin-top: clamp(32px, 4vw, 56px); animation: pmarq 40s linear infinite; }
.p-track span { font-family: var(--display); font-weight: 800; font-size: clamp(20px, 2.2vw, 32px); letter-spacing: .02em; color: #9aa6b4; white-space: nowrap; transition: color .3s ease; }
.p-track span:hover { color: var(--black); }
.p-track { align-items: center; gap: clamp(48px, 6vw, 96px); }
.p-track img { width: auto; max-width: none; object-fit: contain; display: block; }
.partners:hover .p-track { animation-play-state: paused; }
@keyframes pmarq { to { transform: translateX(-50%); } }
.partners .note { margin-top: 28px; font-size: 12.5px; color: var(--grey); }
/* ---------- Footer ---------- */
.site-footer { background: var(--black); color: var(--white); border-top: 1px solid var(--line-dark); }
.foot-contact { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line-dark); }
.foot-contact > div { padding-block: 40px; display: grid; gap: 8px; min-width: 0; }
.foot-contact > div + div { padding-left: 32px; border-left: 1px solid var(--line-dark); }
.foot-contact .label { color: var(--grey); font-size: 10.5px; }
.foot-contact .v { font-family: var(--display); font-weight: 600; font-size: clamp(16px, 1.5vw, 22px); letter-spacing: .04em; overflow-wrap: anywhere; user-select: all; }
.foot-bottom { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px 32px; padding-block: 28px 36px; font-size: 12.5px; color: var(--grey); }
@media (max-width: 760px) { .foot-contact { grid-template-columns: 1fr; } .foot-contact > div + div { padding-left: 0; border-left: 0; border-top: 1px solid var(--line-dark); } .foot-contact > div { padding-block: 24px; } }

/* ---------- Page header (inner pages) ---------- */
.page-head { background: var(--black); color: var(--white); padding-top: calc(env(safe-area-inset-top, 0px) + clamp(140px, 18vw, 230px)); padding-bottom: clamp(48px, 6vw, 88px); }
.page-head h1 { font-size: clamp(60px, 13vw, 230px); }
.page-head .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 40px; align-items: end; margin-top: clamp(28px, 4vw, 48px); }
.page-head .row p { color: #b5b5b2; font-size: 16px; }
@media (max-width: 800px) { .page-head .row { grid-template-columns: 1fr; } }

/* ---------- Filters ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.filters button { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #8e8e8a; padding-block: 8px; position: relative; transition: color .25s ease; }
.filters button sup { font-size: 9.5px; margin-left: 4px; letter-spacing: 0; }
.filters button:hover { color: var(--white); }
.filters button[aria-pressed="true"] { color: var(--white); }
.filters button[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--white); }
.note-sample { font-size: 13px; color: var(--grey); }
.portfolio-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px 32px; padding-block: 28px; border-top: 1px solid var(--line-dark); background: var(--black); color: var(--white); }

/* ---------- Project detail ---------- */
.p-hero { position: relative; height: 92vh; height: 92svh; min-height: 520px; background: var(--black); color: var(--white); overflow: hidden; }
.p-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: pz 1.6s var(--ease) both; }
@keyframes pz { from { transform: scale(1.06); } to { transform: none; } }
.p-hero::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.35); }
.p-hero .t { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding-bottom: clamp(32px, 5vw, 64px); }
.p-hero h1 { font-size: clamp(46px, 8.5vw, 150px); max-width: 14ch; }
.p-hero .back { display: inline-block; margin-bottom: 22px; }
.meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; padding-block: clamp(36px, 4vw, 56px); border-bottom: 1px solid var(--line); }
.meta dt { margin-bottom: 8px; }
.meta dd { margin: 0; color: #4a4a4d; font-size: 15px; }
@media (max-width: 760px) { .meta { grid-template-columns: 1fr 1fr; } }
.p-text { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(32px, 6vw, 110px); align-items: start; }
.p-text h2 { font-size: clamp(30px, 3.8vw, 60px); line-height: 1; }
.p-text p { color: #b5b5b2; font-size: 17px; max-width: 560px; }
.p-text .smp-note { margin-top: 24px; font-size: 13px; color: var(--grey); }
@media (max-width: 860px) { .p-text { grid-template-columns: 1fr; } }
